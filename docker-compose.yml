
services:
  db:
    image: mysql:8.0
    container_name: numavietnamtravel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wpuserpass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: numavietnamtravel_wp
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wpuserpass
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./:/var/www/html
    restart: always

  wpcli:
    image: wordpress:cli
    container_name: numavietnamtravel_wpcli
    depends_on:
      - db
      - wordpress
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    entrypoint: ["sleep", "infinity"]
    restart: "no"

volumes:
  db_data:
